<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" width="750" height="500">
  <rect width="750" height="500" fill="#c60b1e"/>
  <rect y="125" width="750" height="250" fill="#ffc400"/>
  <!-- Spanish Coat of Arms -->
  <g transform="translate(195, 250) scale(1.15)">
    <!-- Crown -->
    <path d="M-36,-95 L-40,-68 L40,-68 L36,-95 L18,-80 L0,-100 L-18,-80 Z" fill="#ffc400" stroke="#c60b1e" stroke-width="2"/>
    <circle cx="0" cy="-104" r="5" fill="#ffc400"/>
    <circle cx="-36" cy="-97" r="4" fill="#ffc400"/>
    <circle cx="36" cy="-97" r="4" fill="#ffc400"/>
    <ellipse cx="0" cy="-68" rx="40" ry="6" fill="#c60b1e"/>
    <!-- Pillars of Hercules -->
    <!-- Left Column -->
    <rect x="-82" y="-60" width="14" height="120" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="-86" y="55" width="22" height="10" rx="2" fill="#cbd5e1"/>
    <path d="M-84,-60 L-66,-60 L-75,-72 Z" fill="#ffc400"/>
    <!-- Left Ribbon -->
    <path d="M-92,-15 Q-75,-25 -58,-15 Q-75,-5 -92,-15 Z" fill="#c60b1e"/>
    <text x="-75" y="-12" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">PLUS</text>
    <!-- Right Column -->
    <rect x="68" y="-60" width="14" height="120" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="64" y="55" width="22" height="10" rx="2" fill="#cbd5e1"/>
    <path d="M66,-60 L84,-60 L75,-72 Z" fill="#ffc400"/>
    <!-- Right Ribbon -->
    <path d="M58,-15 Q75,-25 92,-15 Q75,-5 58,-15 Z" fill="#c60b1e"/>
    <text x="75" y="-12" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">ULTRA</text>
    <!-- Shield Base -->
    <path d="M-45,-60 L45,-60 L45,15 C45,55 0,72 0,72 C0,72 -45,55 -45,15 Z" fill="#ffffff" stroke="#c60b1e" stroke-width="3"/>
    <clipPath id="es-shield-clip">
      <path d="M-45,-60 L45,-60 L45,15 C45,55 0,72 0,72 C0,72 -45,55 -45,15 Z"/>
    </clipPath>
    <g clip-path="url(#es-shield-clip)">
      <!-- Quarter 1: Castile (Red with Gold Castle) -->
      <rect x="-45" y="-60" width="45" height="58" fill="#c60b1e"/>
      <path d="M-30,-22 L-30,-48 L-15,-48 L-15,-22 Z" fill="#ffc400"/>
      <rect x="-33" y="-44" width="21" height="4" fill="#ffc400"/>
      <rect x="-32" y="-52" width="5" height="6" fill="#ffc400"/>
      <rect x="-25" y="-55" width="5" height="9" fill="#ffc400"/>
      <rect x="-18" y="-52" width="5" height="6" fill="#ffc400"/>
      <!-- Quarter 2: Leon (Silver with Purple/Pink Lion) -->
      <rect x="0" y="-60" width="45" height="58" fill="#ffffff"/>
      <path d="M12,-20 C10,-28 15,-45 25,-48 C28,-40 32,-35 30,-26 C28,-20 22,-20 22,-20 Z" fill="#9333ea"/>
      <circle cx="26" cy="-48" r="3" fill="#ffc400"/>
      <!-- Quarter 3: Aragon (Gold with 4 Red Pallets) -->
      <rect x="-45" y="-2" width="45" height="74" fill="#ffc400"/>
      <rect x="-40" y="-2" width="4.5" height="74" fill="#c60b1e"/>
      <rect x="-31" y="-2" width="4.5" height="74" fill="#c60b1e"/>
      <rect x="-22" y="-2" width="4.5" height="74" fill="#c60b1e"/>
      <rect x="-13" y="-2" width="4.5" height="74" fill="#c60b1e"/>
      <!-- Quarter 4: Navarre (Red with Gold Chains) -->
      <rect x="0" y="-2" width="45" height="74" fill="#c60b1e"/>
      <path d="M5,5 L40,40 M40,5 L5,40 M5,22.5 L40,22.5 M22.5,5 L22.5,40" stroke="#ffc400" stroke-width="2.5"/>
      <rect x="8" y="8" width="29" height="29" fill="none" stroke="#ffc400" stroke-width="2"/>
      <circle cx="22.5" cy="22.5" r="3" fill="#10b981"/>
      <!-- Enté en point: Granada (Pomegranate) -->
      <path d="M-12,72 L0,48 L12,72 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="0" cy="62" r="5" fill="#10b981"/>
      <circle cx="0" cy="62" r="3" fill="#c60b1e"/>
      <!-- Inescutcheon: Bourbon-Anjou (Blue oval with 3 Gold Fleurs-de-lis) -->
      <ellipse cx="0" cy="-2" rx="11" ry="14" fill="#1d4ed8" stroke="#c60b1e" stroke-width="2"/>
      <path d="M-5,-4 C-5,-7 0,-9 0,-9 C0,-9 5,-7 5,-4 C3,-4 2,-1 0,3 C-2,-1 -3,-4 -5,-4 Z" fill="#ffc400"/>
      <path d="M-4,4 C-4,2 0,1 0,1 C0,1 4,2 4,4 C2,4 1,6 0,8 C-1,6 -2,4 -4,4 Z" fill="#ffc400"/>
    </g>
  </g>
</svg>
