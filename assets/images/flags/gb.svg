<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="24" height="16">
  <clipPath id="gb-t">
    <path d="M300,150 L600,0 L600,300 Z M300,150 L0,300 L0,0 Z M300,150 L600,300 L0,300 Z M300,150 L0,0 L600,0 Z"/>
  </clipPath>
  <!-- Blue Field -->
  <rect width="600" height="300" fill="#012169"/>
  <!-- St Andrew's White Saltire -->
  <path d="M0,0 L600,300 M600,0 L0,300" stroke="#ffffff" stroke-width="60"/>
  <!-- St Patrick's Red Saltire -->
  <path d="M0,0 L600,300 M600,0 L0,300" stroke="#c8102e" stroke-width="20" clip-path="url(#gb-t)"/>
  <!-- St George's White Cross Border -->
  <path d="M300,0 V300 M0,150 H600" stroke="#ffffff" stroke-width="100"/>
  <!-- St George's Red Cross -->
  <path d="M300,0 V300 M0,150 H600" stroke="#c8102e" stroke-width="60"/>
</svg>
