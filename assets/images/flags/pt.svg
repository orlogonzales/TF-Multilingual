<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background: 2/5 Green, 3/5 Red -->
  <rect width="240" height="400" fill="#046a38"/>
  <rect x="240" width="360" height="400" fill="#da291c"/>
  <!-- Armillary Sphere & Shield Centered at (240, 200) -->
  <g transform="translate(240, 200)">
    <!-- Armillary Sphere in Gold -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#ffc72c" stroke-width="14"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#ffc72c" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="82" ry="32" fill="none" stroke="#ffc72c" stroke-width="8"/>
    <ellipse cx="0" cy="0" rx="32" ry="82" fill="none" stroke="#ffc72c" stroke-width="8"/>
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#ffc72c" stroke-width="12"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#ffc72c" stroke-width="12"/>
    <path d="M-70,-70 L70,70" stroke="#ffc72c" stroke-width="14"/>
    <!-- Portuguese Traditional Shield -->
    <path d="M-52,-70 L52,-70 L52,15 C52,65 0,85 0,85 C0,85 -52,65 -52,15 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <!-- Red Bordure with 7 Gold Castles -->
    <path d="M-50,-68 L50,-68 L50,15 C50,62 0,81 0,81 C0,81 -50,62 -50,15 Z" fill="#da291c"/>
    <!-- Castles on Bordure -->
    <!-- Top 3 -->
    <g fill="#ffc72c">
      <path d="M-36,-64 h12 v16 h-12 z M-36,-67 h3 v3 h-3 z M-31,-67 h3 v3 h-3 z M-27,-67 h3 v3 h-3 z"/>
      <path d="M-6,-64 h12 v16 h-12 z M-6,-67 h3 v3 h-3 z M-1,-67 h3 v3 h-3 z M3,-67 h3 v3 h-3 z"/>
      <path d="M24,-64 h12 v16 h-12 z M24,-67 h3 v3 h-3 z M29,-67 h3 v3 h-3 z M33,-67 h3 v3 h-3 z"/>
      <!-- Sides (2 left, 2 right) -->
      <path d="M-44,-30 h12 v15 h-12 z M-44,-33 h3 v3 h-3 z M-39,-33 h3 v3 h-3 z M-35,-33 h3 v3 h-3 z"/>
      <path d="M32,-30 h12 v15 h-12 z M32,-33 h3 v3 h-3 z M37,-33 h3 v3 h-3 z M41,-33 h3 v3 h-3 z"/>
      <path d="M-40,10 h12 v15 h-12 z M-40,7 h3 v3 h-3 z M-35,7 h3 v3 h-3 z M-31,7 h3 v3 h-3 z"/>
      <path d="M28,10 h12 v15 h-12 z M28,7 h3 v3 h-3 z M33,7 h3 v3 h-3 z M37,7 h3 v3 h-3 z"/>
    </g>
    <!-- Inner White Shield -->
    <path d="M-30,-50 L30,-50 L30,12 C30,45 0,60 0,60 C0,60 -30,45 -30,12 Z" fill="#ffffff"/>
    <!-- 5 Blue Shields (Quinas) arranged in cross -->
    <defs>
      <g id="pt-quina">
        <path d="M-7,-10 L7,-10 L7,3 C7,11 0,14 0,14 C0,14 -7,11 -7,3 Z" fill="#003399"/>
        <!-- 5 White Bezants in saltire -->
        <circle cx="0" cy="-6" r="1.5" fill="#ffffff"/>
        <circle cx="-3.5" cy="-2" r="1.5" fill="#ffffff"/>
        <circle cx="3.5" cy="-2" r="1.5" fill="#ffffff"/>
        <circle cx="-3.5" cy="4" r="1.5" fill="#ffffff"/>
        <circle cx="3.5" cy="4" r="1.5" fill="#ffffff"/>
      </g>
    </defs>
    <!-- Center Quina -->
    <use href="#pt-quina" x="0" y="2"/>
    <!-- Top Quina -->
    <use href="#pt-quina" x="0" y="-30"/>
    <!-- Bottom Quina -->
    <use href="#pt-quina" x="0" y="32"/>
    <!-- Left Quina -->
    <use href="#pt-quina" x="-18" y="2"/>
    <!-- Right Quina -->
    <use href="#pt-quina" x="18" y="2"/>
  </g>
</svg>
